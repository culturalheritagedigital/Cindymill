# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
lang: en-US
title: Cindymill
email: cindymill@culturalheritage.digital
description: "A gentle way to start your journey into CNC milling."
baseurl: ""  # the subpath of your site, e.g. /blog
url: ""  # the base hostname & protocol for your site, e.g. http://example.com
author:
  name: Niko Plath
  twitter: 
  picture: /assets/images/cindymill_2.jpg
twitter_username: 
github_username: culturalheritagedigital/cindymill
logo: #/assets/icons/basically-basic-logo-light.svg
search: false
search_full_content: false
search_provider: Lunr # algolia
algolia:
  application_id: #QB6HVGBSBA
  index_name: #basically-basic
  search_only_api_key: #9d5014e5bbc77372547bce778dfa5663
  powered_by: # true (default), false

google_analytics: G-EFN1CTB4WB

# Liquid
liquid:
  error_mode: strict

# Build settings
markdown: kramdown

#local
theme: jekyll-theme-basically-basic

# github pages
#remote_theme: "mmistakes/jekyll-theme-basically-basic"

plugins: # previously gems
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
feed:
  path: atom.xml

# Pagination - https://jekyllrb.com/docs/pagination/
paginate: 10
paginate_path: /page:num/

# Exclude from processing.
# Achtung: Eine eigene exclude-Liste ersetzt Jekylls Standardliste vollstaendig,
# deshalb sind die Standardeintraege hier mit aufgefuehrt.
exclude:
  # Modell-/CAD-Daten des Repositories - gehoeren nicht in die gebaute Website
  - model/
  - README.md
  - LICENSE
  - cindymill_front_1.jpg
  # Projektinterne Dokumentation
  - MODERNISIERUNG_UND_GITHUB_PAGES.md
  - jekyll-theme-basically-basic.gemspec
  # Jekyll-Standardliste
  - Gemfile
  - Gemfile.lock
  - gemfiles/
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Collections
collections:
  assembly:
    output: true
    permalink: /:collection/:path/
  parts:
    output: true
    permalink: /:collection/:path/
  gallery:
    output: true
    permalink: /:collection/:path/


# Front Matter Defaults
defaults:
  # _assembly
  - scope:
      path: "_assembly"
      type: assembly
    values:
      layout: post
      read_time: true
  # _parts
  - scope:
      path: "_parts"
      type: parts
    values:
      layout: post
      read_time: true
  # _gallery
  - scope:
      path: "_gallery"
      type: gallery
    values:
      layout: post
      read_time: false

